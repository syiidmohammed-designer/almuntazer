:root{--ink:#103C44;--bg:#FAF6EC;--card:#fff;--muted:#46595D;--teal:#49B1BA;--yel:#FACF28;--grn:#659D00;--red:#CC1F25;--tt:#E6F4F6;--yt:#FFF4CF;--line:#E6DFC8;--dk:#103C44;--cr:#FAF6EC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EAF0FA;--bg:#0B1B33;--card:#13294B;--muted:#AFC0DA;--tt:#102746;--yt:#1D2B47;--line:#25406B;--deep:#0A1730}}
:root[data-theme="dark"]{--ink:#EAF0FA;--bg:#0B1B33;--card:#13294B;--muted:#AFC0DA;--tt:#102746;--yt:#1D2B47;--line:#25406B;--deep:#0A1730}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Mikhak,Tahoma,Arial,sans-serif;font-size:17px;line-height:1.85}
img{max-width:100%}a{color:inherit}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}h1{font-size:clamp(2rem,5vw,3.4rem)}h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}h3{font-size:1.2rem}
p{margin:6px 0 12px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .in{display:flex;align-items:center;gap:18px;padding:8px 20px;max-width:1080px;margin:0 auto}
header img.lg{height:46px;width:auto;background:#fff;border-radius:14px;padding:2px 8px}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;padding:4px 14px;border-radius:99px;font-weight:700;font-size:.95rem}
nav a.on{background:var(--yel);color:var(--dk)}nav a:hover{background:var(--tt)}nav a.on:hover{background:var(--yel)}
section.blk{padding:46px 0}.tint{background:var(--tt)}.ytint{background:var(--yt)}
.pill{display:inline-block;background:var(--yel);color:var(--dk);border-radius:99px;padding:0 16px;font-size:.85rem;font-weight:700}
.btn{display:inline-block;border:0;border-radius:99px;padding:8px 26px;font:700 1rem Mikhak,sans-serif;cursor:pointer;text-decoration:none;background:var(--yel);color:var(--dk);box-shadow:0 4px 0 rgba(16,60,68,.25)}
.btn.t{background:var(--teal)}.btn.o{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--ink)}
.btn:active{transform:translateY(2px)}
.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:0 6px 18px rgba(16,60,68,.12)}
.tile{border-radius:24px;padding:22px;color:var(--dk);box-shadow:0 6px 18px rgba(16,60,68,.14)}
.c-t{background:var(--teal)}.c-y{background:var(--yel)}.c-g{background:var(--grn)}.c-r{background:var(--red);color:#fff}.c-w{background:#fff}.c-d{background:var(--deep);color:var(--cr)}
.ico{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid var(--dk);display:flex;align-items:center;justify-content:center;margin-bottom:10px}.ico img{width:38px;height:38px}
.hero{position:relative;overflow:hidden;padding:54px 0 70px;background:var(--dk);color:var(--cr)}
.hero .b{position:absolute;border-radius:50%}.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{color:var(--cr)}.hero p{color:#E6EFEF;font-size:1.15rem}
.hero .lgbox img{width:100%;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero .lgbox{order:-1}}
.stat{text-align:center}.stat b{display:block;font-size:2.4rem;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.chip{border:2px solid var(--ink);border-radius:99px;padding:2px 16px;background:transparent;color:var(--ink);font:700 .95rem Mikhak,sans-serif;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg)}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 14px;border:2px solid var(--line);border-radius:14px;font:inherit;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--teal);border-color:var(--teal)}
input[type=checkbox],input[type=radio]{width:auto}.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}
.opt{display:inline-flex;gap:8px;align-items:center;margin:4px 14px 4px 0;font-weight:400}
.note{background:var(--yt);border:2px dashed var(--yel);border-radius:18px;padding:14px 18px;margin:14px 0}
.ok{background:var(--tt);border:2px solid var(--teal)}
.stars{display:flex;gap:6px;flex-direction:row-reverse;justify-content:flex-end}.stars input{display:none}.stars label{font-size:2.2rem;margin:0;cursor:pointer;color:var(--line);line-height:1}.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:var(--yel)}
.tier{border-radius:24px;padding:20px 26px;color:var(--dk);margin:0 auto 14px;display:flex;gap:16px;align-items:center;box-shadow:0 6px 18px rgba(16,60,68,.14)}
.tier .ico{margin:0;flex:none}
table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}th{background:var(--tt)}
.tw{overflow-x:auto;border-radius:16px;background:var(--card)}
.bar{height:14px;border-radius:9px;background:var(--teal);min-width:4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}.task input{margin-top:9px}

footer{background:var(--deep);color:var(--cr);padding:28px 0;margin-top:40px;text-align:center;font-size:.95rem}
.sm{font-size:.9rem;color:var(--muted)}

:root{--bg:#FFFFFF;--deep:#103C44}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-12px)}}
@keyframes spin{to{rotate:360deg}}
@keyframes wob{0%,100%{transform:rotate(-11deg) scale(1)}50%{transform:rotate(9deg) scale(1.05)}}
@keyframes shim{0%,35%{transform:translateX(-300%) skewX(-20deg)}75%,100%{transform:translateX(1400%) skewX(-20deg)}}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}.rv.in{opacity:1;transform:none}
.dec{position:absolute;pointer-events:none;z-index:0}.dr{animation:drift 7s ease-in-out infinite}.sp{animation:spin 14s linear infinite}.fl{animation:fl 5s ease-in-out infinite}
.hero2{position:relative;overflow:hidden;text-align:center;padding:300px 0 44px;background:var(--bg)}
.hero2 .wrap{position:relative;z-index:1}.hero2 p{max-width:620px;margin:10px auto 16px;color:var(--muted);font-size:1.1rem}
.ph{position:absolute;top:34px;width:min(22vw,230px);aspect-ratio:1;border-radius:24px;overflow:hidden;box-shadow:0 18px 36px rgba(16,60,68,.22);z-index:1}
.ph.l{left:12%;rotate:-4deg}.ph.r{right:12%;rotate:4deg}.ph .fl,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .bd{position:absolute;inset:0;margin:auto;width:46%;height:46%}
.bd{background:#fff;border:4px solid var(--dk);border-radius:50%;display:flex;align-items:center;justify-content:center}.bd img{width:62%;height:62%}
.mk{background:var(--yel);color:var(--dk);padding:0 14px;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.eb{color:var(--teal);font-weight:700;letter-spacing:1px}
.sc{display:inline-block;font-weight:700;color:var(--teal);text-decoration:none;margin-top:6px}.sc i{display:inline-block;font-style:normal;animation:bnc 1.6s ease-in-out infinite}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));text-align:center}.feats>div{padding:14px 10px;border-inline-start:1px solid var(--line)}.feats>div:first-child{border:0}
.fi{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}.fi img{width:44px;height:44px}
.band{background:var(--yel);rotate:-1.2deg;margin:34px -30px;padding:12px 0;overflow:hidden;white-space:nowrap;box-shadow:0 6px 0 var(--tt)}
.trk{display:inline-flex;direction:ltr;animation:tick 30s linear infinite}.trk span{font-weight:700;color:var(--dk);display:inline-flex;gap:34px;align-items:center;padding-right:34px}.trk i{width:9px;height:9px;background:var(--teal);rotate:45deg;display:inline-block}
.band:hover .trk{animation-play-state:paused}
.offer{background:var(--yt);border-block:2px solid var(--yel);padding:14px 0;position:relative;overflow:hidden}.offer .wrap{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.offer:after{content:"";position:absolute;top:0;bottom:0;left:0;width:70px;background:rgba(255,255,255,.6);animation:shim 6s ease-in-out infinite}
.feat{padding:78px 0;position:relative;background:var(--bg)}.feat .wrap{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.feat.bg-t{background:var(--teal);color:var(--dk)}
.feat.bg-t:before,.feat.bg-t:after{content:"";position:absolute;left:0;right:0;height:22px;background:var(--bg)}
.feat.bg-t:before{top:0;-webkit-mask:radial-gradient(circle at 12px 0,transparent 0 12px,#000 13px) 0 0/24px 22px repeat-x;mask:radial-gradient(circle at 12px 0,transparent 0 12px,#000 13px) 0 0/24px 22px repeat-x}
.feat.bg-t:after{bottom:0;-webkit-mask:radial-gradient(circle at 12px 100%,transparent 0 12px,#000 13px) 0 0/24px 22px repeat-x;mask:radial-gradient(circle at 12px 100%,transparent 0 12px,#000 13px) 0 0/24px 22px repeat-x}
.flip .wrap>:first-child{order:2}
.circ{position:relative;width:min(100%,360px);aspect-ratio:1;margin:auto;border-radius:50%;border:1.5px dashed rgba(16,60,68,.35);display:flex;align-items:center;justify-content:center}
.in2{position:relative;width:80%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 18px 40px rgba(16,60,68,.25);display:flex;align-items:center;justify-content:center;border:4px solid var(--dk)}
.in2 img.pt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.in2 .bd{position:relative;width:48%;aspect-ratio:1}
.star{position:absolute;top:-6px;left:-4px;width:118px;height:118px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8rem;font-weight:700;color:var(--dk);animation:wob 6s ease-in-out infinite;line-height:1.3}
.btn.g{background:var(--grn);color:#fff}.lnk{font-weight:700;margin-inline-start:16px;text-decoration:none}
.card{border:1px solid var(--line)}.card,.tile{transition:transform .25s,box-shadow .25s}.card:hover,.tile:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(16,60,68,.2)}
@media(max-width:760px){.ph{display:none}.hero2{padding-top:40px}.feat .wrap{grid-template-columns:1fr}.flip .wrap>:first-child{order:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes wander{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-18px,-12px) rotate(2deg)}40%{transform:translate(14px,-24px) rotate(-2deg)}60%{transform:translate(22px,10px) rotate(1deg)}80%{transform:translate(-10px,18px) rotate(-1deg)}}
@keyframes flyInL{from{opacity:0;transform:translateX(-100px) rotate(-10deg)}to{opacity:1;transform:none}}
@keyframes flyInR{from{opacity:0;transform:translateX(100px) rotate(10deg)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes sqz{0%,100%{transform:scale(1)}50%{transform:scale(.97)}}
@keyframes pulseH{from{opacity:.88;transform:scale(1)}to{opacity:1;transform:scale(1.03)}}
.orbs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);animation:glow 7s ease-in-out infinite,wander 26s ease-in-out infinite}
.o1{width:440px;height:440px;background:radial-gradient(circle,rgba(73,177,186,.6),transparent 70%);top:-8%;left:60%}
.o2{width:380px;height:380px;background:radial-gradient(circle,rgba(250,207,40,.55),transparent 70%);top:28%;left:-6%;animation-delay:1.2s}
.o3{width:340px;height:340px;background:radial-gradient(circle,rgba(101,157,0,.45),transparent 70%);top:62%;left:50%;animation-delay:2.4s}
.o4{width:300px;height:300px;background:radial-gradient(circle,rgba(73,177,186,.5),transparent 70%);top:80%;left:6%;animation-delay:3.2s}
#prog{position:fixed;top:0;right:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,#49B1BA,#FACF28,#659D00);border-radius:0 0 0 3px}
.ibtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .25s}.ibtn:hover{transform:rotate(20deg)}
.btn:active{animation:sqz .25s}

header.pillbar{background:transparent;border:0;top:10px;padding:0 14px;z-index:30}
.pbar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:99px;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(16,60,68,.14)}
.pbar .lg{height:34px;padding:2px 8px;border-radius:12px}.pbar nav{flex:1}
.cta{padding:5px 20px!important;font-size:.9rem!important;flex:none;text-decoration:none}
.hero2{background:transparent}.feat{background:transparent}.feat.bg-t{background:var(--teal)}
.hero2 .wrap>*{animation:fadeUp .9s cubic-bezier(.2,.7,.3,1) both}.hero2 .wrap>*:nth-child(2){animation-delay:.12s}.hero2 .wrap>*:nth-child(3){animation-delay:.24s}.hero2 .wrap>*:nth-child(4){animation-delay:.36s}.hero2 .wrap>*:nth-child(5){animation-delay:.48s}
.hero2 .mk{display:inline-block;animation:pulseH 2.6s ease-in-out infinite alternate}
.ph.l{animation:flyInL 1s .2s cubic-bezier(.2,.7,.3,1) both}.ph.r{animation:flyInR 1s .35s cubic-bezier(.2,.7,.3,1) both}
.rv{transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.7,.3,1),transform .8s cubic-bezier(.2,.7,.3,1)}.rv.in{transform:none}
.band{background:linear-gradient(100deg,var(--teal),#9BD6A3 55%,var(--yel));padding:12px 0;box-shadow:0 8px 0 rgba(16,60,68,.08)}
.band .trk.rev{animation-direction:reverse;animation-duration:36s;margin-top:8px}
.band .tl{display:inline-flex;align-items:center;gap:34px;padding-right:34px}.band .tl b{background:#fff;color:var(--dk);border:2px solid var(--dk);border-radius:14px;padding:2px 18px;box-shadow:3px 3px 0 var(--dk);font-size:1.05rem}
@media (prefers-reduced-motion:reduce){.orb,.hero2 .wrap>*,.ph{animation:none!important}}
.ibtn.bk{color:var(--grn);border-color:transparent;background:transparent;width:40px;height:40px}.ibtn.bk:hover{transform:translateX(3px);background:var(--tt)}
.ibtn.pen{color:var(--ink)}.ibtn.pen:hover{background:var(--tt);transform:none}
</style>
</head>

function reveal(){const els=document.querySelectorAll('#app .card,#app .tile,#app .tier,#app .feats>div,#app .rv,#app h2');els.forEach(e=>e.classList.add('rv'));if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}}),{threshold:.1});els.forEach((e,i)=>{e.style.transitionDelay=(i%4)*70+'ms';io.observe(e);});}
function burst(x,y){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<12;i++){const s=document.createElement('span');s.innerHTML=i%2?HT(14):LF(20);s.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;pointer-events:none;z-index:50';document.body.appendChild(s);const a=Math.PI*2*i/12+Math.random()*.5,d=50+Math.random()*60;s.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},{transform:'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d)+'px) scale(1) rotate('+Math.round(Math.random()*240-120)+'deg)',opacity:0}],{duration:750,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();}}
